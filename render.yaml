services:
  - type: web
    name: cow-ops-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard under Environment → Secret Files / Env Vars:
      # SUPABASE_URL             https://oawgfzgfufzyebowxlpx.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY
      # SUPABASE_ANON_KEY
      # TELEGRAM_BOT_TOKEN
      # TELEGRAM_WEBHOOK_SECRET
      # TELEGRAM_WEBHOOK_DOMAIN  <your-render-service>.onrender.com
      # OPENAI_API_KEY
      # API_SECRET_KEY
      # SESSION_SECRET
      # BOT_PASSWORD
      # ADMIN_TELEGRAM_IDS
      # GOOGLE_SERVICE_ACCOUNT_JSON  (paste the full JSON key as one line)
